<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎤 Diljit Dosanjh – AURA India Tour | Road Trip Checklist</title>
<meta name="description" content="Chandrapur → Ahmedabad road-trip packing checklist. Tick off what you’ve packed. Saved on your own phone.">
<meta property="og:title" content="🎤 Diljit Dosanjh – AURA India Tour | Road Trip Checklist">
<meta property="og:description" content="Chandrapur → Ahmedabad. Tick off what you’ve packed. Your progress is saved on your own phone.">
<meta property="og:type" content="website">
<style>
:root{--burg:#702D3D;--peach:#F4B6A6;--bg:#FFF7ED;--sage:#A8B5A0;--text:#292929;--card:#FFFFFF;--muted:#6b5a5e;--line:rgba(112,45,61,.12);--sh:0 6px 20px rgba(112,45,61,.10);--ink:#702D3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1317;--text:#f6ecee;--card:#2a1c22;--muted:#c3aab1;--line:rgba(244,182,166,.18);--sh:none;--ink:#F4B6A6}}
:root[data-theme="dark"]{--bg:#1d1317;--text:#f6ecee;--card:#2a1c22;--muted:#c3aab1;--line:rgba(244,182,166,.18);--sh:none;--ink:#F4B6A6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 70px}
.hero{background:linear-gradient(160deg,#702D3D,#4a1c28);color:#fff;border-radius:26px;padding:22px 18px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"♪ ♫ ♪";position:absolute;right:14px;top:10px;color:var(--peach);opacity:.35;font-size:1.6rem;letter-spacing:6px}
.hero h1{margin:0;font-size:1.1rem;letter-spacing:.4px}
.hero h2{margin:4px 0 12px;font-size:1.5rem;color:var(--peach)}
.route{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:16px;font-size:.95rem}
.line{flex:1;border-top:2px dashed var(--peach);position:relative;opacity:.85}
.line:after{content:"🚗";position:absolute;top:-13px;left:var(--p,0%);transition:left .5s}
.bar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--peach);border-radius:99px;transition:width .4s}
.stats{display:flex;justify-content:space-between;font-size:.85rem;margin-top:7px}
.cat{background:var(--card);border-radius:20px;box-shadow:var(--sh);margin:12px 0;overflow:hidden;border:1px solid var(--line)}
.cat.first{background:#702D3D;color:#fff;border-color:#702D3D;box-shadow:0 10px 26px rgba(112,45,61,.35)}
.cat>button{all:unset;display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;padding:16px;font-weight:800;font-size:1rem;color:var(--ink);cursor:pointer}
.cat.first>button{color:#fff}
.badge{font-size:.7rem;background:var(--peach);color:#702D3D;padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s}
.cat.shut .body{grid-template-rows:0fr}
.body>div{overflow:hidden}
.chev{transition:transform .3s}.cat.shut .chev{transform:rotate(-90deg)}
label{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:50px;cursor:pointer;transition:background .3s}
.first label{border-top-color:rgba(255,255,255,.18)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:2.5px solid var(--ink);border-radius:9px;margin:0;position:relative;background:transparent;transition:all .2s}
.first input{border-color:var(--peach)}
input:checked{background:var(--sage);border-color:var(--sage)}
input:checked:after{content:"✓";position:absolute;inset:0;text-align:center;line-height:22px;color:#fff;font-weight:800}
label.done{background:rgba(168,181,160,.30)}
label.done span{text-decoration:line-through;opacity:.65}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer;margin-top:12px}
.wa{background:#25d366;color:#fff}
.reset{display:block;margin:16px auto 0;background:none;border:1px solid var(--ink);color:var(--ink);border-radius:99px;padding:9px 18px;font-weight:700}
.note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(41,41,41,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.pop{background:var(--card);color:var(--text);border-radius:22px;padding:20px;max-width:340px;width:100%}
.pop h3{margin:0 0 6px;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{margin:0}
.alt{background:var(--peach);color:#702D3D}.go{background:#702D3D;color:#fff}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fx i{position:absolute;top:-20px;font-style:normal;font-size:1.4rem;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>🎤 DILJIT DOSANJH – AURA INDIA TOUR</h1>
<h2>🚗 ROAD TRIP CHECKLIST</h2>
<div class="route"><span>📍 Chandrapur</span><span class="line" id="line"></span><span>Ahmedabad 🏁</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="stats"><span id="packed"></span><span id="pct"></span><span id="left"></span></div>
</div>
<div id="lists"></div>
<button class="reset" id="reset">↺ Reset checklist</button>
<a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">💬 Share on WhatsApp</a>
<p class="note">Your ticks are saved on this phone only.</p>
</div>
<script>
var CATS=[
["🚨","MUST-HAVE ESSENTIALS – PACK FIRST",["Tickets","Driving licence","Aadhaar card / ID proof","Medicines","FASTag recharge","Power bank"]],
["👕","CLOTHING & WINTER ESSENTIALS",["Sweatshirt / jacket / hoodies","Jeans / cargo / track pants","Shorts / vest / nightwear / undergarments","Ear cover for winter","Socks","Shoes / slippers","Sunglasses","Handkerchief"]],
["🧴","PERSONAL CARE & HYGIENE",["Moisturiser","Body wash","Toothpaste / toothbrush","Lip balm / lipstick","Wet wipes / tissues / sanitiser","Comb","Perfume"]],
["🏕️","TRAVEL COMFORT & ACCESSORIES",["Quilt / bedsheet","Foldable chairs","Short purse / wallet / sling bags","Plastic bags / ziplock bags","Earphones"]],
["📸","PHOTOGRAPHY & MEMORIES",["Tripod / camera"]]
];
var KEY="aura-roadtrip-chandrapur-ahmedabad-v1",TOTAL=0,state={},celebrated=false;
CATS.forEach(function(c){TOTAL+=c[2].length});
var $=function(i){return document.getElementById(i)};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){
var box=$("lists");box.innerHTML="";
CATS.forEach(function(c,ci){
var sec=document.createElement("div");sec.className="cat"+(ci===0?" first":"");
var b=document.createElement("button");
b.innerHTML="<span>"+c[0]+" "+c[1]+(ci===0?'<span class="badge">PRIORITY</span>':"")+'</span><span class="chev">▾</span>';
b.onclick=function(){sec.classList.toggle("shut")};
var body=document.createElement("div");body.className="body";var inner=document.createElement("div");
c[2].forEach(function(t,ii){
var k=ci+"-"+ii,l=document.createElement("label"),i=document.createElement("input"),s=document.createElement("span");
i.type="checkbox";i.checked=!!state[k];l.className=i.checked?"done":"";s.textContent=t;
i.onchange=function(){if(i.checked)state[k]=1;else delete state[k];l.className=i.checked?"done":"";save();stats()};
l.appendChild(i);l.appendChild(s);inner.appendChild(l)});
body.appendChild(inner);sec.appendChild(b);sec.appendChild(body);box.appendChild(sec)});
stats()}
function stats(){
var n=Object.keys(state).length,p=Math.round(n/TOTAL*100);
$("fill").style.width=p+"%";$("line").style.setProperty("--p",Math.min(p,92)+"%");
$("packed").textContent=n+" packed";$("left").textContent=(TOTAL-n)+" remaining";$("pct").textContent=p+"%";
if(n===TOTAL&&!celebrated){celebrated=true;party()}
if(n<TOTAL)celebrated=false}
function party(){
var f=document.createElement("div");f.className="fx";var e=["🎉","🎤","🚗","❤️","✨","🎶"];
for(var i=0;i<36;i++){var s=document.createElement("i");s.textContent=e[i%6];s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*.8+"s";f.appendChild(s)}
document.body.appendChild(f);setTimeout(function(){f.remove()},3800)}
$("reset").onclick=function(){
var m=document.createElement("div");m.className="modal";
m.innerHTML='<div class="pop"><h3>Reset your checklist?</h3><div>This unticks every item on this phone. It can’t be undone.</div><div class="row"><button class="btn alt" id="no">Cancel</button><button class="btn go" id="yes">Reset</button></div></div>';
document.body.appendChild(m);
m.querySelector("#no").onclick=function(){m.remove()};
m.querySelector("#yes").onclick=function(){state={};save();m.remove();celebrated=false;render()}};
var url=location.href.split("#")[0];
var msg="🎤 Diljit Dosanjh – AURA India Tour 🚗\n\nOur Chandrapur to Ahmedabad road-trip packing checklist is ready!\n\nOpen the link and tick off the things you’ve packed.\n\nEveryone has their own separately saved checklist, so your progress won’t affect anyone else’s.\n\nLet’s get packing! ❤️\n\n"+url;
$("wa").href="https://wa.me/?text="+encodeURIComponent(msg);
render();
</script>
</body>
</html>
